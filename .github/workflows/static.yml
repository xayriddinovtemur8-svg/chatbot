name: Deploy Mini App to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Aynan shu yerda GitHub-ga qaysi papkani internetga chiqarishni ko'rsatamiz:
          path: './miniapp'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
